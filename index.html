<!doctype html>
<html lang="en-CA" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STRATA — Adewale Gbadamosi · Software Developer</title>
    <meta
      name="description"
      content="Adewale Gbadamosi — software developer in Canada. Engineer by training, scientist by method, developer by craft. AWS Solutions Architect & Developer Associate, ISTQB Certified Tester."
    />
    <meta name="theme-color" content="#070d1f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the theme before first paint: saved choice, else the OS setting.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('strata-theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eef4fb')
      })()
    </script>

    <meta name="author" content="Adewale Gbadamosi" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph / LinkedIn. Absolute URLs: set VITE_SITE_URL (see .env). Image source: scripts/og/og.html -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STRATA" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Adewale Gbadamosi · Software Developer" />
    <meta
      property="og:description"
      content="Engineer by training. Scientist by method. Developer by craft. A career core sample, drilled layer by layer."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Adewale Gbadamosi, Software Developer. A core sample of five career layers: cloud, software, environmental science, automotive QC, engineering." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
