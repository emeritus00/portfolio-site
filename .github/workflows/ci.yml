name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · type-check · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Absolute URLs for canonical + Open Graph tags. Set the SITE_URL repo variable after `terraform apply`.
          VITE_SITE_URL: ${{ vars.SITE_URL || 'http://localhost:5173' }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  infra:
    name: Terraform fmt · validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  deploy:
    name: Deploy to S3 + CloudFront
    needs: [verify, infra]
    # Only from main, and only once the AWS variables exist (see README → Deploy).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # No `environment:` here on purpose: it would change the OIDC subject to
    # repo:…:environment:… and the IAM trust policy only accepts refs/heads/main.
    permissions:
      id-token: write # OIDC: short-lived AWS credentials, no stored keys
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Assets first and never deleted here: visitors still on the previous index.html
      # keep loading their (old, hashed) files while the new version rolls out.
      - name: Upload hashed assets (cached for a year)
        run: |
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload everything else (always revalidated)
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" \
            --exclude "assets/*" --cache-control "public,max-age=0,must-revalidate" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
